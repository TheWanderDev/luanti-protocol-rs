name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * 1"

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Record runner details
        run: |
          rustc +stable --version --verbose > benchmark-environment.txt
          uname -a >> benchmark-environment.txt
          lscpu >> benchmark-environment.txt

      - name: Benchmark compression
        run: cargo +stable bench --bench compression

      - name: Benchmark mapblock
        run: cargo +stable bench --bench mapblock

      - name: Benchmark packet
        run: cargo +stable bench --bench packet

      - name: Upload benchmark reports
        uses: actions/upload-artifact@v7.0.2
        with:
          name: criterion-${{ github.sha }}
          path: |
            target/criterion/
            benchmark-environment.txt
          if-no-files-found: error
          retention-days: 30
