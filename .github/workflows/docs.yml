name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "src/**"
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "src/**"
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install mdBook
        run: cargo +stable install mdbook --locked

      - name: Generate Rust API documentation
        run: cargo +stable doc --no-deps --lib

      - name: Integrate Rustdoc into mdBook source
        run: |
          rm -rf docs/src/api
          mkdir -p docs/src/api
          cp -a target/doc/. docs/src/api/

      - name: Build mdBook
        run: cd docs && mdbook build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/book

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
