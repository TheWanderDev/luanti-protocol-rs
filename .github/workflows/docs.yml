
name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install nightly --profile minimal

      - name: Install mdBook
        run: cargo +stable install mdbook --locked

      - name: Generate Rust API documentation
        run: cargo +stable doc --no-deps --lib

      - name: Integrate Rustdoc into mdBook source
        run: |
          rm -rf crates/luanti-protocol-rs/docs/src/api
          mkdir -p crates/luanti-protocol-rs/docs/src/api
          cp -a target/doc/. crates/luanti-protocol-rs/docs/src/api/

      - name: Build mdBook
        working-directory: crates/luanti-protocol-rs/docs
        run: mdbook build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: crates/luanti-protocol-rs/docs/book

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
