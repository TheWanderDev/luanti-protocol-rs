[package]
name = "luanti-protocol-rs"
version = "0.5.18"
edition = "2024"
readme = "README.md"
description = "luanti protocol rust implementation"
documentation = "https://docs.rs/luanti-protocol-rs"
license = "LGPL-3.0-only"
keywords = ["protocol", "networking", "serialization", "binary", "codec"]
categories = ["network-programming", "encoding"]

[dependencies]
ahash = "0.8.12"
base64 = "0.23.1"
bytes = "1.12.2"
csscolorparser = "0.9.0"
flate2 = "1.1.11"
glam = "0.34.2"
memchr = "2.8.3"
num_enum = "0.7.6"
serde_json = "1"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
winnow = { version = "1.0.5", features = ["simd"] }
zstd = "0.14.4"
tracing = "0.1.44"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "compression"
harness = false

[[bench]]
name = "mapblock"
harness = false

[[bench]]
name = "packet"
harness = false

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
all = { level = "deny", priority = -2 }
complexity = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
excessive_nesting = "warn"
too_many_lines = "warn"
too_many_arguments = "warn"
type_complexity = "deny"
module_name_repetitions = "warn"
must_use_candidate = "warn"
return_self_not_must_use = "warn"
needless_pass_by_value = "warn"
